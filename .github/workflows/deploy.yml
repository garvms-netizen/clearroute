name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Don't cancel a run in progress — let it finish so a
# half-published site never ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        # NEXT_PUBLIC_* is inlined at build time, which is why the Apps Script
        # endpoint lives in Actions *Variables* rather than Secrets — a secret
        # would be masked in logs but still shipped in the bundle, so hiding it
        # would be theatre. It is a public write endpoint by design.
        env:
          NEXT_PUBLIC_SHEETS_ENDPOINT: ${{ vars.NEXT_PUBLIC_SHEETS_ENDPOINT }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
