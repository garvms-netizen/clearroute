name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild every 30 minutes on weekdays so the quotes stay near-current.
  # `npm run prebuild` pulls them from Yahoo, which cannot be called from the
  # browser (no CORS headers), so the build is the only place that data gets
  # in — there is no server to refresh it on demand.
  #
  # 30 minutes rather than 5, deliberately. GitHub documents that scheduled
  # workflows are delayed or dropped under load, so a 5-minute cron does not
  # reliably run every 5 minutes, and Pages throttles frequent redeploys.
  # 48 runs a day is well inside both limits and keeps the figure minutes to
  # half an hour old rather than a day old.
  #
  # Weekdays only: FX spot does not trade over the weekend, so a Saturday
  # rebuild would republish Friday's closing price as if it were new.
  #
  # Free: Actions minutes are unmetered for public repositories.
  schedule:
    - cron: "*/30 * * * 1-5"

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Don't cancel a run in progress — let it finish so a
# half-published site never ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        # NEXT_PUBLIC_* is inlined at build time, which is why the Apps Script
        # endpoint lives in Actions *Variables* rather than Secrets — a secret
        # would be masked in logs but still shipped in the bundle, so hiding it
        # would be theatre. It is a public write endpoint by design.
        env:
          NEXT_PUBLIC_SHEETS_ENDPOINT: ${{ vars.NEXT_PUBLIC_SHEETS_ENDPOINT }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
